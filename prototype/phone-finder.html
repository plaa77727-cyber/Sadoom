<!--
  Phone Finder — Single-file prototype
  ------------------------------------------------------------------
  ไฟล์นี้แบ่งเป็น Section ตาม Architecture (docs/ARCHITECTURE.md)
  เพื่อให้แยกเป็นไฟล์/โฟลเดอร์ได้ง่ายเมื่อย้ายไป Next.js:

    <style>   1. Design tokens       → src/styles/tokens.css
              2. Base / Layout / UI  → src/styles/globals.css + components/ui
    <script>  1. CONFIG              → src/config/*
              2. DATA                → data/phones/*.json, data/picks/*.json
              3. RECOMMENDATION      → src/core/recommendation/*
              4. STATE (compare)     → src/hooks/useCompareList
              5. UTILS               → src/lib/*
              6. COMPONENTS          → src/components/*
              7. PAGES               → src/app/*
              8. ROUTER + EVENTS     → (Next.js จัดการให้)
-->

<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface-2: #f1f4f8;
  --text: #0f172a;
  --muted: #5b6b80;
  --border: #e3e8ef;
  --accent: #2458d6;
  --accent-text: #ffffff;
  --accent-soft: #edf2fd;
  --positive: #157347;
  --caution: #a15c07;
  --radius: 14px;
  --radius-sm: 10px;
  --font: "Inter", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --max-w: 1120px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1017;
    --surface: #131a24;
    --surface-2: #1a2330;
    --text: #e6eaf0;
    --muted: #97a3b4;
    --border: #243041;
    --accent: #6c9bff;
    --accent-text: #0c1017;
    --accent-soft: #18243a;
    --positive: #5fd08e;
    --caution: #f0b35a;
  }
}

/* ============================================================
   2. BASE / LAYOUT / UI
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.65;
}
body.has-tray { padding-bottom: 84px; }
a { color: inherit; }
img, svg { display: block; max-width: 100%; }
h1, h2, h3, h4 { line-height: 1.3; margin: 0; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.xs { font-size: 12.5px; }

.container { max-width: var(--max-w); margin: 0 auto; padding: 0 16px; }
.section { padding: 40px 0; }
.section-head { margin-bottom: 20px; }
.section-head h2 { font-size: 24px; }
.section-head p { margin-top: 6px; }
.stack > * + * { margin-top: 12px; }

/* Header */
.site-header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.site-header .bar { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.logo { font-weight: 700; text-decoration: none; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
.logo-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav a {
  text-decoration: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 15px;
}
.nav a:hover { color: var(--text); background: var(--surface-2); }
.nav a.active { color: var(--text); background: var(--surface-2); }
.menu-btn { display: none; background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
@media (max-width: 720px) {
  .menu-btn { display: block; }
  .nav {
    display: none; position: absolute; left: 0; right: 0; top: 60px;
    flex-direction: column; padding: 8px 16px 16px; background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .nav.open { display: flex; }
  .nav a { padding: 12px; }
}

/* Footer */
.site-footer { border-top: 1px solid var(--border); padding: 28px 0 40px; margin-top: 40px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.btn:hover { border-color: color-mix(in srgb, var(--text) 30%, var(--border)); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, black); border-color: transparent; }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn-ghost { background: none; border-color: transparent; }
.btn.is-on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Card */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

/* Chip / Badge */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2); font-size: 13.5px; font-weight: 500;
}
.badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; }
.badge-slot { background: var(--accent-soft); color: var(--accent); }
.badge-caution { background: color-mix(in srgb, var(--caution) 14%, transparent); color: var(--caution); }

/* Selectable option (Finder) */
.options { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.option {
  text-align: left; width: 100%; padding: 16px 18px; border-radius: var(--radius);
  border: 1.5px solid var(--border); background: var(--surface); cursor: pointer;
  transition: border-color .15s, background .15s;
}
.option:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); }
.option[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.option[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.option .title { font-weight: 600; display: block; }
.option .desc { font-size: 14px; color: var(--muted); display: block; margin-top: 2px; }

/* Hero */
.hero { padding: 64px 0 48px; }
.hero h1 { font-size: clamp(34px, 6vw, 54px); letter-spacing: -0.025em; max-width: 14ch; }
.hero p { font-size: 18px; color: var(--muted); max-width: 52ch; margin-top: 16px; }
.hero .cta { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }

.steps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.step-num { font-size: 13px; font-weight: 700; color: var(--accent); }

/* Finder */
.finder { max-width: 820px; margin: 0 auto; padding: 32px 0 120px; }
.stepper { display: flex; gap: 8px; margin-bottom: 24px; }
.stepper span { flex: 1; height: 4px; border-radius: 4px; background: var(--border); }
.stepper span.done { background: var(--accent); }
.finder h1 { font-size: 28px; }
.finder-actions {
  display: flex; justify-content: space-between; gap: 12px; margin-top: 28px;
}
@media (max-width: 720px) {
  .finder-actions {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; margin: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--border);
  }
  .finder-actions .btn { flex: 1; }
}

/* Phone image */
.phone-img { display: flex; justify-content: center; padding: 12px 0; background: var(--surface-2); border-radius: var(--radius-sm); }

/* Recommendation card */
.rec { display: flex; flex-direction: column; gap: 14px; }
.rec h3 { font-size: 19px; }
.price { font-weight: 700; font-size: 18px; }
.keyspecs { display: grid; gap: 4px; font-size: 14px; }
.keyspecs li { display: flex; gap: 8px; }
.keyspecs .k { color: var(--muted); min-width: 64px; }
.headline { font-weight: 500; }
.list-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
.bullets li { position: relative; padding-left: 18px; font-size: 14.5px; }
.bullets li + li { margin-top: 4px; }
.bullets li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.bullets.pos li::before { background: var(--positive); }
.bullets.neg li::before { background: var(--caution); }
.bullets.why li::before { background: var(--accent); }
.pc { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
@media (max-width: 420px) { .pc { grid-template-columns: 1fr; } }
.card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
.card-actions .btn { flex: 1; }

/* Detail */
.detail { display: grid; gap: 32px; grid-template-columns: 340px 1fr; padding: 32px 0; align-items: start; }
.detail-aside { position: sticky; top: 80px; }
@media (max-width: 860px) {
  .detail { grid-template-columns: 1fr; }
  .detail-aside { position: static; }
}
.spec-section h2 { font-size: 20px; margin-bottom: 10px; }
.spec-rows { border-top: 1px solid var(--border); }
.spec-rows > div { display: grid; grid-template-columns: 160px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 15px; }
.spec-rows dt { color: var(--muted); }
.spec-rows dd { margin: 0; }
@media (max-width: 480px) { .spec-rows > div { grid-template-columns: 1fr; gap: 0; } }
.note { font-size: 14px; color: var(--muted); margin-top: 6px; }
.variants { display: flex; flex-wrap: wrap; gap: 8px; }

/* Compare */
.compare-head {
  position: sticky; top: 60px; z-index: 5; background: var(--bg);
  display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--border);
}
.compare-head .ph { text-align: center; font-weight: 600; font-size: 14px; }
.compare-head .ph .phone-img { background: none; padding: 0 0 6px; }
.cmp-row { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; }
.cmp-row .label { color: var(--muted); font-weight: 500; }
.cmp-row .val { overflow-wrap: anywhere; }
@media (max-width: 720px) {
  .cmp-row .label { grid-column: 1 / -1; font-size: 13px; }
  .cmp-row .val { font-size: 14px; }
  .compare-head .spacer { display: none; }
}
.compare-tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 20px 0 8px; }
select {
  font: inherit; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); max-width: 100%;
}

/* Compare tray */
.tray {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
}
.tray .container { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tray-names { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Filter chips */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.filters button { border: 1px solid var(--border); background: var(--surface); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.filters button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Phone list item */
.phone-tile { display: flex; gap: 14px; align-items: center; text-decoration: none; }
.phone-tile .phone-img { flex: 0 0 88px; padding: 8px 0; }
.phone-tile h3 { font-size: 16px; }

/* Picks */
.pick { display: flex; flex-direction: column; gap: 12px; }
.pick .cat { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }

/* Notice / toast */
.notice { padding: 14px 16px; border-radius: var(--radius-sm); background: var(--surface-2); font-size: 14.5px; }
.toast {
  position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 40;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }

details.guide summary { cursor: pointer; font-weight: 600; list-style: none; }
details.guide summary::-webkit-details-marker { display: none; }
details.guide[open] summary { margin-bottom: 10px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

/* ============================================================
   3. RECOMMENDATION ENGINE
   - Rule-based + qualitative tiers
   - ไม่มีตัวเลขคะแนนใด ๆ ส่งออกไปที่ UI
   ============================================================ */
const Engine = (() => {
  const rank = (tier) => TIERS.indexOf(tier);
  const atLeast = (tier, min) => rank(tier) >= rank(min);
  const tierFrom = (value, [ex, good, fair]) =>
    value >= ex ? "excellent" : value >= good ? "good" : value >= fair ? "fair" : "weak";

  // 3.1 แปลงสเปก → Traits (editorial assessment override สิ่งที่สเปกบอกไม่ได้)
  function deriveTraits(p) {
    const a = p.assess;
    const hz = p.display.hz;
    return {
      performance: a.performance,
      thermal: a.thermal,
      camera: a.camera,
      video: a.video,
      speakers: a.speakers,
      value: a.value,
      display: hz >= THRESHOLDS.refreshHz.excellent ? "excellent"
             : hz >= THRESHOLDS.refreshHz.good ? (p.display.nits >= THRESHOLDS.brightNits ? "excellent" : "good")
             : "fair",
      battery: a.batteryLife || tierFrom(p.battery.mah, THRESHOLDS.batteryMah),
      charging: tierFrom(p.charging.wired, THRESHOLDS.chargingW),
      software: tierFrom(p.updates.security, THRESHOLDS.securityYears),
      zoom: p.cameras.tele ? (p.cameras.tele.zoom >= THRESHOLDS.zoomExcellent ? "excellent" : "good") : "weak",
      ultrawide: p.cameras.ultrawide ? "good" : "weak",
    };
  }

  // 3.2 ข้อความเหตุผลต่อมิติ (pos = ผ่านเกณฑ์, neg = ไม่ผ่าน)
  const REASONS = {
    performance: { pos: (p) => `ชิป ${p.chipset} แรงพอสำหรับเกมและงานหนัก`, neg: () => "ประสิทธิภาพระดับกลาง เกมหนักอาจต้องลดกราฟิก" },
    thermal:     { pos: () => "ระบายความร้อนดี ใช้งานหนักนาน ๆ ยังลื่น", neg: () => "ใช้งานหนักต่อเนื่องอาจร้อนและช้าลง" },
    display:     { pos: (p) => `จอ ${p.display.size}" ${p.display.panel} ${p.display.hz}Hz ลื่นและสว่าง`, neg: (p) => `จอ ${p.display.hz}Hz ยังไม่ลื่นเท่าจอ 120Hz ขึ้นไป` },
    battery:     {
      pos: (p) => p.assess.batteryLife ? "แบตใช้งานได้ทั้งวันจากการจัดการพลังงานที่ดี" : `แบต ${fmtNum(p.battery.mah)} mAh ใช้งานได้ทั้งวันสบาย ๆ`,
      neg: () => "แบตระดับกลาง ใช้หนักอาจต้องชาร์จระหว่างวัน",
    },
    charging:    { pos: (p) => `ชาร์จเร็ว ${p.charging.wired}W`, neg: (p) => `ชาร์จ ${p.charging.wired}W ค่อนข้างช้า` },
    camera:      { pos: (p) => `กล้องหลัก ${p.cameras.main} ให้ภาพดีและประมวลผลเก่ง`, neg: () => "คุณภาพกล้องพอใช้ ไม่ได้โดดเด่นในงบนี้" },
    video:       { pos: (p) => `ถ่ายวิดีโอได้ดี (${p.cameras.video})`, neg: () => "ความสามารถด้านวิดีโอค่อนข้างพื้นฐาน" },
    zoom:        {
      pos: (p) => `มีเลนส์เทเลโฟโต้ ${p.cameras.tele.desc} ซูมได้คมกว่าการครอปภาพ`,
      neg: (p) => p.cameras.tele ? `เลนส์ซูม ${p.cameras.tele.zoom}x ยังซูมไกลได้จำกัด` : "ไม่มีเลนส์ซูม (เทเลโฟโต้)",
    },
    ultrawide:   { pos: (p) => `มีกล้องมุมกว้าง ${p.cameras.ultrawide}`, neg: () => "ไม่มีกล้องมุมกว้าง" },
    speakers:    { pos: () => "ลำโพงเสียงดี ดูหนังฟังเพลงเพลิน", neg: () => "ลำโพงเสียงธรรมดา" },
    software:    { pos: (p) => `อัปเดตความปลอดภัยนาน ${p.updates.security} ปี ใช้ได้ยาว`, neg: (p) => `ระยะอัปเดตซอฟต์แวร์ค่อนข้างสั้น (${p.updates.security} ปี)` },
    value:       { pos: () => "สเปกคุ้มค่าเมื่อเทียบกับราคา", neg: () => "ราคาค่อนข้างสูงเมื่อเทียบกับสเปก" },
  };

  // 3.3 Lifestyle profiles: essential = ต้องผ่าน, preferred = ควรมี (เรียงตามความสำคัญ)
  const PROFILES = {
    balanced: {
      label: "Balanced", title: "ใช้งานรอบด้าน", desc: "ถ่ายรูป เล่นโซเชียล ดูวิดีโอ ทำงาน — ทุกอย่างดีพอ",
      phrase: "ต้องการมือถือที่ใช้งานได้ดีรอบด้าน",
      essential: { performance: "fair", camera: "fair", battery: "fair" },
      preferred: [["performance", "good"], ["camera", "good"], ["battery", "good"], ["display", "good"], ["software", "good"]],
    },
    camera: {
      label: "Camera", title: "เน้นกล้อง", desc: "ถ่ายรูป ถ่ายวิดีโอ ซูม มุมกว้าง",
      phrase: "ชอบถ่ายรูปและวิดีโอ",
      essential: { camera: "good" },
      preferred: [["camera", "excellent"], ["video", "good"], ["zoom", "good"], ["ultrawide", "good"], ["software", "good"]],
    },
    gaming: {
      label: "Gaming", title: "เน้นเล่นเกม", desc: "ชิปแรง จอลื่น เครื่องไม่ร้อนง่าย",
      phrase: "เน้นเล่นเกม",
      essential: { performance: "good" },
      preferred: [["performance", "excellent"], ["thermal", "good"], ["display", "good"], ["battery", "good"], ["charging", "good"]],
    },
    battery: {
      label: "Battery", title: "แบตอึด", desc: "ใช้ทั้งวันไม่ต้องพกพาวเวอร์แบงก์",
      phrase: "ต้องการแบตอึด",
      essential: { battery: "good" },
      preferred: [["battery", "excellent"], ["charging", "good"], ["software", "good"]],
    },
    entertainment: {
      label: "Entertainment", title: "ดูหนัง / โซเชียล", desc: "จอสวย ลำโพงดี ดูซีรีส์ได้นาน",
      phrase: "ชอบดูหนัง ดูซีรีส์ และเล่นโซเชียล",
      essential: { display: "good" },
      preferred: [["display", "excellent"], ["speakers", "good"], ["battery", "good"], ["performance", "good"]],
    },
    value: {
      label: "Value", title: "คุ้มค่า", desc: "ได้สเปกและอายุการใช้งานมากที่สุดต่อเงินที่จ่าย",
      phrase: "มองหาความคุ้มค่า",
      essential: { value: "good" },
      preferred: [["value", "excellent"], ["software", "good"], ["performance", "good"], ["battery", "good"]],
    },
  };

  // มิติที่ใช้ดูภาพรวมสำหรับ slot "สมดุล"
  const CORE_DIMENSIONS = ["performance", "camera", "battery", "display", "charging", "software", "speakers"];

  function combineProfiles(ids) {
    const essential = {};
    const preferred = new Map();
    for (const id of ids) {
      const pr = PROFILES[id];
      for (const [dim, min] of Object.entries(pr.essential)) {
        if (!essential[dim] || rank(min) > rank(essential[dim])) essential[dim] = min;
      }
      for (const [dim, min] of pr.preferred) {
        if (!preferred.has(dim) || rank(min) > rank(preferred.get(dim))) preferred.set(dim, min);
      }
    }
    return { essential, preferred: [...preferred.entries()] };
  }

  function variantInRange(phone, min, max) {
    return phone.variants
      .filter((v) => v.price >= min && v.price <= max)
      .sort((a, b) => a.price - b.price)[0] || null;
  }

  function evaluate(phone, variant, profile, overBudget) {
    const traits = deriveTraits(phone);
    const essentialFails = Object.entries(profile.essential).filter(([d, min]) => !atLeast(traits[d], min));
    const met = [], unmet = [];
    for (const [dim, min] of profile.preferred) (atLeast(traits[dim], min) ? met : unmet).push(dim);
    const coreTiers = CORE_DIMENSIONS.map((d) => traits[d]);
    return {
      phone, variant, traits, met, unmet, overBudget,
      essentialOk: essentialFails.length === 0,
      weakCount: coreTiers.filter((t) => t === "weak").length,
      fairCount: coreTiers.filter((t) => t === "fair").length,
    };
  }

  // 3.4 Slot comparators — เปรียบเทียบทีละเกณฑ์ (lexicographic) ไม่รวมเป็นคะแนน
  const byPrice = (a, b) => a.variant.price - b.variant.price;
  const COMPARATORS = {
    focused: (profile) => (a, b) => {
      if (b.met.length !== a.met.length) return b.met.length - a.met.length;
      for (const [dim] of profile.preferred) {
        const diff = rank(b.traits[dim]) - rank(a.traits[dim]);
        if (diff) return diff;
      }
      return byPrice(a, b);
    },
    balanced: () => (a, b) =>
      a.weakCount - b.weakCount || a.fairCount - b.fairCount || b.met.length - a.met.length || byPrice(a, b),
    value: () => (a, b) => rank(b.traits.value) - rank(a.traits.value) || byPrice(a, b),
  };

  function pick(pool, comparator, chosen) {
    const sorted = pool.filter((e) => !chosen.includes(e)).sort(comparator);
    if (!sorted.length) return null;
    // Diversity: ถ้าตัวแรกแบรนด์ซ้ำกับที่เลือกแล้ว และตัวถัดไปเท่ากันในเชิงเกณฑ์ ให้เลือกแบรนด์ใหม่
    const brands = chosen.map((e) => e.phone.brand);
    const [first, second] = sorted;
    if (second && brands.includes(first.phone.brand) && !brands.includes(second.phone.brand)) {
      const tie = comparator(first, { ...second, variant: first.variant }) === 0;
      if (tie) return second;
    }
    return first;
  }

  // 3.5 สร้างคำอธิบาย
  function lifestylePhrase(ids) {
    return ids.map((id) => PROFILES[id].phrase).join("และ");
  }

  function explain(ev, slot, ids, profile) {
    const p = ev.phone;
    const names = ids.map((id) => PROFILES[id].label).join(" + ");
    const phrase = lifestylePhrase(ids);
    const headline = {
      focused:  `เหมาะสำหรับคนที่${phrase}เป็นหลัก`,
      balanced: `เหมาะสำหรับคนที่${phrase} แต่ยังต้องการมือถือที่ใช้งานทั่วไปได้ดี เช่น ถ่ายรูป ดูวิดีโอ และโซเชียล`,
      value:    `เหมาะสำหรับคนที่ต้องการความคุ้มค่าในงบนี้ โดยยังตอบโจทย์ ${names}`,
    }[slot];
    const slotReason = {
      focused:  `ตอบโจทย์ ${names} ได้ครบหลายข้อในงบนี้`,
      balanced: "เมื่อดูภาพรวมทั้งกล้อง แบต จอ และประสิทธิภาพ แทบไม่มีจุดอ่อนชัดเจน",
      value:    `ราคาเริ่มต้นประมาณ ฿${fmtNum(ev.variant.price)} ประหยัดกว่าตัวเลือกอื่นที่ผ่านเกณฑ์`,
    }[slot];

    const essentialDims = Object.keys(profile.essential).filter((d) => !ev.met.includes(d));
    const reasonDims = [...ev.met, ...essentialDims.filter((d) => atLeast(ev.traits[d], profile.essential[d]))];
    const why = [slotReason, ...reasonDims.slice(0, 3).map((d) => REASONS[d].pos(p))];

    const considerations = ev.unmet.slice(0, 2).map((d) => REASONS[d].neg(p));
    for (const c of p.cons) {
      if (considerations.length >= 2) break;
      considerations.push(c);
    }
    const flags = [];
    if (ev.overBudget) flags.push("เกินงบเล็กน้อย");
    if (!ev.essentialOk) flags.push("ผ่านเกณฑ์บางข้อ");
    return { headline, why, considerations, flags };
  }

  // 3.6 Public API
  function recommend(phones, budgetId, lifestyleIds) {
    const budget = BUDGETS.find((b) => b.id === budgetId);
    const ids = lifestyleIds.filter((id) => PROFILES[id]).slice(0, MAX_LIFESTYLES);
    if (!budget || !ids.length) return { items: [], notes: ["กรุณาเลือกงบและไลฟ์สไตล์"] };

    const profile = combineProfiles(ids);
    const inBudget = [], over = [];
    for (const p of phones) {
      const v = variantInRange(p, budget.min, budget.max);
      if (v) { inBudget.push(evaluate(p, v, profile, false)); continue; }
      const ov = variantInRange(p, budget.max + 1, budget.max * OVER_BUDGET_TOLERANCE);
      if (ov) over.push(evaluate(p, ov, profile, true));
    }

    const notes = [];
    let pool = inBudget.filter((e) => e.essentialOk);
    if (pool.length < 3) {
      const extra = over.filter((e) => e.essentialOk);
      if (extra.length) notes.push("ในงบนี้มีตัวเลือกที่ตรงเกณฑ์ไม่มาก เราจึงรวมรุ่นที่เกินงบไม่เกิน 10% มาให้พิจารณา");
      pool = pool.concat(extra);
    }
    if (pool.length < 3) {
      const relaxed = inBudget.filter((e) => !e.essentialOk);
      if (relaxed.length) notes.push("บางรุ่นผ่านเกณฑ์ไม่ครบทุกข้อ เราระบุจุดที่ควรพิจารณาไว้ในการ์ดแล้ว");
      pool = pool.concat(relaxed);
    }

    const chosen = [], items = [];
    for (const slot of ["focused", "balanced", "value"]) {
      const ev = pick(pool, COMPARATORS[slot](profile), chosen);
      if (!ev) continue;
      chosen.push(ev);
      items.push({ slot, phone: ev.phone, variant: ev.variant, ...explain(ev, slot, ids, profile) });
    }
    if (items.length < 3) notes.push(`ในงบนี้เราพบรุ่นที่เหมาะสม ${items.length} รุ่น — เราเลือกแสดงเท่าที่เหมาะจริง แทนการเติมให้ครบ 3 รุ่น`);
    return { items, notes, lifestyles: ids, budget };
  }

  return { recommend, PROFILES, deriveTraits };
})();

const SLOT_LABELS = {
  focused: (ids) => `ตรงกับ ${ids.map((id) => Engine.PROFILES[id].label).join(" + ")} มากที่สุด`,
  balanced: () => "สมดุลกว่า",
  value: () => "คุ้มค่าในงบนี้",
};

/* ============================================================
   4. STATE — Compare list (localStorage แบบปลอดภัย)
   ============================================================ */
const CompareStore = (() => {
  const KEY = "phone-finder:compare";
  let ids = [];
  try { ids = JSON.parse(localStorage.getItem(KEY) || "[]").filter(getPhone); } catch { ids = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ids)); } catch { /* ignore */ } };
  return {
    get: () => [...ids],
    has: (id) => ids.includes(id),
    toggle(id) {
      if (ids.includes(id)) { ids = ids.filter((x) => x !== id); save(); return "removed"; }
      if (ids.length >= MAX_COMPARE) return "full";
      ids.push(id); save(); return "added";
    },
    set(next) { ids = next.filter(getPhone).slice(0, MAX_COMPARE); save(); },
    clear() { ids = []; save(); },
  };
})();

/* ============================================================
   5. UTILS
   ============================================================ */
function getPhone(id) { return PHONES.find((p) => p.id === id) || null; }
function fullName(p) { return `${p.brand} ${p.model}`; }
function fmtNum(n) { return Number(n).toLocaleString("th-TH"); }
function fmtPrice(n) { return `฿${fmtNum(n)}`; }
function minPrice(p) { return Math.min(...p.variants.map((v) => v.price)); }
function fmtDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleDateString("th-TH", { year: "numeric", month: "long", day: "numeric" });
}
function fmtMonth(ym) {
  const d = new Date(`${ym}-01`);
  return d.toLocaleDateString("en-US", { year: "numeric", month: "long" });
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function budgetOf(price) { return BUDGETS.find((b) => price >= b.min && price <= b.max); }
function variantLabel(v) { return `${v.ram}GB / ${v.storage >= 1024 ? v.storage / 1024 + "TB" : v.storage + "GB"}`; }

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

    ["แบตเตอรี่", (p) => `${fmtNum(p.battery.mah)} mAh`],
    ["ชาร์จ", (p) => `${p.charging.wired}W${p.charging.wireless ? ` · ไร้สาย ${p.charging.wireless}W` : ""}`],
    ["กล้องหลัก", (p) => p.cameras.main],
    ["มุมกว้าง", (p) => p.cameras.ultrawide || "—"],
    ["เทเลโฟโต้", (p) => (p.cameras.tele ? p.cameras.tele.desc : "—")],
    ["กล้องหน้า", (p) => p.cameras.front],
    ["วิดีโอ", (p) => p.cameras.video],
    ["ระบบ", (p) => p.os],
    ["อัปเดตความปลอดภัย", (p) => `${p.updates.security} ปี`],
    ["กันน้ำ", (p) => p.ip],
    ["น้ำหนัก", (p) => `${p.weight} g`],
  ];
  const cols = `grid-template-columns: ${"minmax(0,1fr) ".repeat(phones.length)}`;
  const colsDesktop = `grid-template-columns: 170px ${"minmax(0,1fr) ".repeat(phones.length)}`;

  const body = rows.map(([label, fn]) => {
    const values = phones.map(fn);
    const same = values.every((v) => v === values[0]);
    if (showDiffOnly && same) return "";
    return `<div class="cmp-row" data-cols>
      <div class="label">${esc(label)}</div>
      ${values.map((v) => `<div class="val num">${esc(v)}</div>`).join("")}
    </div>`;
  }).join("");

  return `
    <style>
      .cmp-row, .compare-head { ${colsDesktop}; }
      @media (max-width: 720px) { .cmp-row, .compare-head { ${cols}; } }
    </style>
    <section class="section"><div class="container">
      <div class="section-head"><h1 style="font-size:30px">Compare</h1>
        <p class="muted">เปรียบเทียบข้อมูลแบบเป็นกลาง — เราไม่ตัดสินว่ารุ่นไหนชนะ</p></div>
      <div class="compare-tools">
        ${picker}
        <label class="small" style="display:flex;gap:8px;align-items:center;cursor:pointer">
          <input type="checkbox" data-action="diff-toggle" ${showDiffOnly ? "checked" : ""}> แสดงเฉพาะที่ต่างกัน
        </label>
      </div>
      <div class="compare-head">
        <div class="spacer"></div>
        ${phones.map((p) => `
          <div class="ph">
            ${PhoneImage(p, 90)}
            <a href="#/phones/${esc(p.id)}">${esc(fullName(p))}</a>
            <div><button class="btn btn-sm btn-ghost xs" data-action="toggle-compare" data-id="${esc(p.id)}">ลบออก</button></div>
          </div>`).join("")}
      </div>
      ${body || `<div class="notice" style="margin-top:12px">ทุกหัวข้อมีค่าเหมือนกัน</div>`}
      <p class="note" style="margin-top:16px">ราคาโดยประมาณ ข้อมูลอัปเดต ${esc(fmtDate(DATA_UPDATED))}</p>
    </div></section>`;
}

function PickCard(pick) {
  const p = getPhone(pick.phoneId);
  const cat = PICK_CATEGORIES.find((c) => c.key === pick.key);
  if (!p || !cat) return "";
  const alts = (pick.alternatives || []).map(getPhone).filter(Boolean);
  return `
    <article class="card pick">
      <div><div class="cat">${esc(cat.label)}</div><div class="xs muted">${esc(cat.desc)}</div></div>
      ${PhoneImage(p, 150)}
      <div>
        <h3 style="font-size:18px">${esc(fullName(p))}</h3>
        <div class="small muted num">เริ่มต้น ~${fmtPrice(minPrice(p))}</div>
      </div>
      <p class="small">${esc(pick.blurb)}</p>
      ${alts.length ? `<p class="xs muted">ตัวเลือกอื่นที่น่าสนใจ: ${alts.map((a) => `<a href="#/phones/${esc(a.id)}">${esc(fullName(a))}</a>`).join(", ")}</p>` : ""}
      <div class="card-actions"><a class="btn btn-sm" href="#/phones/${esc(p.id)}">View Details</a>${CompareButton(p.id)}</div>
    </article>`;
}

function PicksPage(month) {
  const sorted = [...MONTHLY_PICKS].sort((a, b) => b.month.localeCompare(a.month));
  const current = month ? sorted.find((m) => m.month === month) : sorted[0];
  if (!current) return `<div class="container section"><div class="notice">ไม่พบข้อมูลเดือนนี้ <a href="#/picks">ดูเดือนล่าสุด</a></div></div>`;
  return `
    <section class="section"><div class="container">
      <div class="section-head">
        <p class="small muted">Phones of the Month</p>
        <h1 style="font-size:30px">${esc(current.title)}</h1>
        <p class="muted" style="margin-top:6px">${esc(current.intro)}</p>
        <p class="note">"Best" คือหมวดคำแนะนำของเรา ไม่ใช่การให้คะแนน — แต่ละหมวดมีตัวเลือกอื่นให้พิจารณาด้วย</p>
      </div>
      ${sorted.length > 1 ? `<div class="filters">${sorted.map((m) =>
        `<a class="chip" href="#/picks/${m.month}" ${m === current ? 'aria-current="page"' : ""}>${esc(fmtMonth(m.month))}</a>`).join("")}</div>` : ""}
      <div class="grid">${current.picks.map(PickCard).join("")}</div>
    </div></section>`;
}

function GuidesPage() {
  const guides = [
    ["RAM เท่าไหร่ถึงพอ?", "สำหรับ Android ปี 2026 RAM 8GB เพียงพอสำหรับคนทั่วไป ถ้าเล่นเกมหนักหรือเปิดแอปพร้อมกันเยอะ 12GB จะสบายกว่า ส่วน iPhone จัดการ RAM ได้ดีจึงไม่ต้องดูตัวเลขมาก"],
    ["mAh มากกว่า = แบตอึดกว่าเสมอไหม?", "ไม่เสมอไป ประสิทธิภาพของชิปและซอฟต์แวร์มีผลมาก มือถือที่แบตเล็กกว่าอาจใช้งานได้นานพอ ๆ กันถ้าจัดการพลังงานดี"],
    ["ทำไมระยะเวลาอัปเดตซอฟต์แวร์สำคัญ?", "อัปเดตความปลอดภัยช่วยปกป้องข้อมูลของคุณ ถ้าวางแผนใช้เครื่องนาน 4–6 ปี ควรเลือกรุ่นที่ได้อัปเดตนานพอ"],
  ];
  return `
    <section class="section"><div class="container" style="max-width:760px">
      <div class="section-head"><h1 style="font-size:30px">Guides</h1><p class="muted">ความรู้พื้นฐานช่วยตัดสินใจ (กำลังเพิ่มบทความ)</p></div>
      <div class="stack">${guides.map(([t, body]) => `
        <details class="card guide"><summary>${esc(t)}</summary><p class="muted">${esc(body)}</p></details>`).join("")}</div>
    </div></section>`;
}

function NotFoundPage() {
  return `<div class="container section"><div class="notice">ไม่พบหน้านี้ <a href="#/">กลับหน้าแรก</a></div></div>`;
}

/* ============================================================
   8. ROUTER + EVENTS
   ============================================================ */
function parseRoute() {
  const raw = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = raw.split("?");
  return { parts: path.split("/").filter(Boolean), query: new URLSearchParams(qs || "") };
}

function render({ keepScroll = false } = {}) {
  const { parts, query } = parseRoute();
  const [section, param] = parts;
  let html;
  switch (section) {
    case undefined: html = HomePage(); break;
    case "finder":
      if (query.get("budget")) {
        Finder.budget = BUDGETS.some((b) => b.id === query.get("budget")) ? query.get("budget") : null;
        Finder.lifestyles = (query.get("ls") || "").split(",").filter((id) => Engine.PROFILES[id]).slice(0, MAX_LIFESTYLES);
        Finder.step = Finder.budget ? 2 : 1;
        history.replaceState(null, "", "#/finder");
      }
      html = FinderPage();
      break;
    case "results": html = ResultsPage(query); break;
    case "phones": html = param ? PhoneDetailPage(param) : PhonesPage(query); break;
    case "compare": html = ComparePage(query); break;
    case "picks": html = PicksPage(param); break;
    case "guides": html = GuidesPage(); break;
    default: html = NotFoundPage();
  }
  document.getElementById("app").innerHTML = html;

  const trayHtml = CompareTray();
  document.getElementById("tray-root").innerHTML = trayHtml;
  document.body.classList.toggle("has-tray", !!trayHtml);

  const navKey = section || "";
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("active", a.dataset.nav === navKey));
  document.getElementById("nav").classList.remove("open");
  if (!keepScroll) window.scrollTo(0, 0);
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const { action, id } = el.dataset;

  switch (action) {
    case "toggle-menu": {
      const nav = document.getElementById("nav");
      nav.classList.toggle("open");
      el.setAttribute("aria-expanded", nav.classList.contains("open"));
      return;
    }
    case "start-finder":
      Finder.step = 1; Finder.budget = null; Finder.lifestyles = [];
      return; // ปล่อยให้ลิงก์พาไป #/finder
    case "select-budget":
      Finder.budget = id; render({ keepScroll: true }); return;
    case "finder-next":
      if (Finder.budget) { Finder.step = 2; render(); } return;
    case "finder-back":
      Finder.step = 1; render(); return;
    case "toggle-lifestyle": {
      const on = Finder.lifestyles.includes(id);
      if (on) Finder.lifestyles = Finder.lifestyles.filter((x) => x !== id);
      else if (Finder.lifestyles.length >= MAX_LIFESTYLES) { toast(`เลือกได้สูงสุด ${MAX_LIFESTYLES} แบบ`); return; }
      else Finder.lifestyles.push(id);
      render({ keepScroll: true }); return;
    }
    case "finder-submit":
      if (Finder.budget && Finder.lifestyles.length) {
        location.hash = `#/results?budget=${Finder.budget}&ls=${Finder.lifestyles.join(",")}`;
      }
      return;
    case "toggle-compare": {
      const result = CompareStore.toggle(id);
      if (result === "full") toast(`เปรียบเทียบได้สูงสุด ${MAX_COMPARE} รุ่น`);
      else toast(result === "added" ? "เพิ่มเข้า Compare แล้ว" : "นำออกจาก Compare แล้ว");
      if (location.hash.startsWith("#/compare")) {
        history.replaceState(null, "", `#/compare?phones=${CompareStore.get().join(",")}`);
      }
      render({ keepScroll: true }); return;
    }
    case "clear-compare":
      CompareStore.clear(); render({ keepScroll: true }); return;
    case "filter-budget":
      location.hash = id === "all" ? "#/phones" : `#/phones?budget=${id}`; return;
  }
});

document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  if (el.dataset.action === "add-compare" && el.value) {
    CompareStore.toggle(el.value);
    history.replaceState(null, "", `#/compare?phones=${CompareStore.get().join(",")}`);
    render({ keepScroll: true });
  }
  if (el.dataset.action === "diff-toggle") {
    showDiffOnly = el.checked;
    render({ keepScroll: true });
  }
});

window.addEventListener("hashchange", () => render());
document.getElementById("data-note").textContent =
  `ข้อมูลตัวอย่างเพื่อการพัฒนา · ราคาโดยประมาณ · อัปเดต ${fmtDate(DATA_UPDATED)} · กรุณาตรวจสอบกับแหล่งทางการก่อนซื้อ`;
render();
</script>
